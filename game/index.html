<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Night Audit</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0a0d15;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      canvas#game {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
        width: 1280px;
        height: 768px;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1280" height="768"></canvas>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
