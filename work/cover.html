<!doctype html>
<html><body style="margin:0;background:#0a0d15">
<canvas id="c" width="1280" height="768"></canvas>
<script type="module">
// Renders the cover poster with the game's own drawing code and holds the frame,
// so the screenshot tool saves exactly what the game would show.
const cfg = await import('./src/config.js');
const cover = await import('./src/cover.js');

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const game = cover.buildCoverGame();
cover.paintCover(ctx, game, 0);
document.title = 'cover-ready';
</script></body></html>
